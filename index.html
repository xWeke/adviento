<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Calendario de Adviento</title>
  <meta name="theme-color" content="#086a39" />

  <!-- Vista previa al compartir el enlace (WhatsApp, iMessage…). La imagen necesita URL absoluta.
       WhatsApp guarda la vista previa de cada enlace: si cambias la imagen, súbele el ?v=. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://xweke.github.io/adviento/" />
  <meta property="og:title" content="Una sorpresa te espera dentro" />
  <meta property="og:description" content="Calendario de Adviento para Andrea" />
  <meta name="description" content="Calendario de Adviento para Andrea" />
  <meta property="og:image" content="https://xweke.github.io/adviento/assets/vista-previa.jpg?v=1" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Puerta roja navideña con el nombre de Andrea" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Icono y modo app al añadirla a la pantalla de inicio (iOS redondea las esquinas solo) -->
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=2" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Adviento" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=42" />
</head>
<body>
  <!-- Franjas que tiñen las barras de Safari en iPhone (ver .barra-safari en styles.css) -->
  <div class="barra-safari barra-arriba" aria-hidden="true"></div>
  <div class="barra-safari barra-abajo" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <div class="bg-dots" aria-hidden="true"></div>
  <div class="nieve" id="nieve" aria-hidden="true"></div>

  <!-- ===================== PORTADA ===================== -->
  <section id="portada" class="portada">
    <div class="portada-luz" aria-hidden="true"></div>
    <div class="capa capa-lejos" data-prof="0.3" aria-hidden="true"></div>
    <div class="capa capa-media" data-prof="0.7" aria-hidden="true"></div>

    <header class="portada-texto p3d">
      <p class="kicker">Diciembre ha llegado</p>
      <h1 class="portada-titulo" data-titulo></h1>
    </header>

    <button class="puerta p3d" id="puerta" type="button" aria-label="Llamar a la puerta para entrar">
      <span class="puerta-marco">
        <span class="puerta-hueco">
          <span class="puerta-interior" aria-hidden="true"></span>
          <span class="hoja hoja-izq"><span class="hoja-deco"></span></span>
          <span class="hoja hoja-der"><span class="hoja-deco"></span></span>
        </span>
      </span>
    </button>

    <p class="portada-cta p3d">Llama para entrar</p>
    <div class="capa capa-cerca" data-prof="1.4" aria-hidden="true"></div>
    <button class="saltar" id="saltar" type="button" hidden>Saltar intro</button>
  </section>

  <div class="destello" aria-hidden="true"></div>

  <!-- ===================== CALENDARIO ===================== -->
  <main id="calendario" class="calendario" hidden>
    <header class="cal-cabecera">
      <p class="kicker">Para</p>
      <h1 class="cal-nombre" data-para></h1>
      <p class="cal-dedicatoria" data-dedicatoria></p>
      <p class="cal-firma">Con cariño, <span data-de></span></p>
    </header>

    <div class="rejilla" id="rejilla"></div>

    <footer class="cal-pie">
      <button type="button" class="enlace" id="volver">Volver a la puerta</button>
    </footer>
  </main>

  <!-- ===================== MODAL DEL DÍA ===================== -->
  <dialog class="modal" id="modal">
    <div class="modal-tarjeta">
      <button class="modal-cerrar" type="button" aria-label="Cerrar">×</button>
      <p class="modal-dia"></p>
      <h2 class="modal-titulo"></h2>
      <div class="modal-cuerpo"></div>
    </div>
  </dialog>

  <button class="btn-sonido" id="sonido" type="button" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="6.5" cy="18" r="2.6" fill="currentColor"/><circle cx="16.5" cy="16" r="2.6" fill="currentColor"/>
      <path class="tachado" d="M3 3l18 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js?v=42"></script>
  <script src="audio.js?v=42"></script>
  <script src="app.js?v=42"></script>
</body>
</html>
